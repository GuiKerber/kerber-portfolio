  <style>
    :root {
      --orange:     #FF4D00;
      --black:      #080808;
      --off-white:  #EDECEA;

      --white-8:  rgba(255,255,255,0.08);
      --white-16: rgba(255,255,255,0.16);
      --white-32: rgba(255,255,255,0.32);
      --white-48: rgba(255,255,255,0.48);
      --white-56: rgba(255,255,255,0.56);

      /* HUD accent. Everything structural is this cyan; category hues only
         ever appear on small marks, so the interface stays one system. */
      --hud:      #6FE3E1;
      --hud-dim:  rgba(111,227,225,0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      background: var(--black);
      color: var(--off-white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    .dots {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,0.028) 1px, transparent 1px);
      background-size: 26px 26px, 78px 78px;
      background-position: 0 0, 13px 13px;
      -webkit-mask-image: radial-gradient(ellipse 80% 72% at 50% 46%, #000 32%, transparent 100%);
              mask-image: radial-gradient(ellipse 80% 72% at 50% 46%, #000 32%, transparent 100%);
    }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px; pointer-events: none;
      background: linear-gradient(180deg, rgba(8,8,8,0.9) 0%, rgba(8,8,8,0) 100%);
    }
    nav > * { pointer-events: auto; }
    .nav-logo { display: block; line-height: 0; opacity: .9; }
    .nav-logo:hover { opacity: 1; }
    .nav-back {
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 500;
      letter-spacing: -0.03em; color: var(--white-56); text-decoration: none;
      transition: color .2s;
    }
    .nav-back:hover { color: var(--off-white); }

    /* ── Map surface ── */
    .map { position: relative; width: 100%; height: 100vh; overflow: hidden; z-index: 1; cursor: grab; }
    .map:active { cursor: grabbing; }
    .links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    .link { fill: none; stroke: var(--hud-dim); stroke-width: 1; }
    /* Energy leaving the core. A short dash travelling the path, offset per
       link so the field pulses unevenly instead of marching in step. */
    .pulse {
      fill: none; stroke: var(--hud); stroke-width: 1.4; stroke-linecap: round;
      stroke-dasharray: 3 210;
      animation: flow 3.2s linear infinite;
      opacity: .85;
    }
    @keyframes flow { from { stroke-dashoffset: 213; } to { stroke-dashoffset: 0; } }

    /* ── Core: HUD rings + 3D mark ── */
    .core {
      position: absolute; left: 50%; z-index: 5;
      transform: translate(-50%, -50%);
      width: 268px; height: 268px;
      display: grid; place-items: center;
    }
    .hud { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .hud circle, .hud line, .hud path { fill: none; stroke: var(--hud); }
    .hud .r-out   { stroke-opacity: .30; stroke-width: 1; }
    .hud .r-mid   { stroke-opacity: .16; stroke-width: 1; stroke-dasharray: 2 6; }
    .hud .r-in    { stroke-opacity: .42; stroke-width: 1; }
    .hud .tick    { stroke-opacity: .34; stroke-width: 1; }
    .hud .sweep   { stroke-opacity: .95; stroke-width: 1.6; stroke-linecap: round;
                    transform-origin: 134px 134px; animation: sweep 14s linear infinite; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    .hud .counter { transform-origin: 134px 134px; animation: sweep 34s linear infinite reverse; }

    .core-mark { width: 124px; height: 124px; position: relative; z-index: 2; }
    .core-mark canvas { width: 100%; height: 100%; display: block; }
    .core-fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
    .core-fallback img { width: 54%; opacity: .9; }
    html.no-webgl .core-mark canvas { display: none; }
    html.no-webgl .core-fallback { display: flex; }

    .core-readout {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: -6px; z-index: 3;
      font-size: 9px; font-weight: 600; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--hud); opacity: .7; white-space: nowrap;
    }

    /* ── Artifact nodes ── */
    .nodes { position: absolute; inset: 0; z-index: 3; }
    .gnode {
      position: absolute; border-radius: 50%;
      background: rgba(111,227,225,0.5);
      pointer-events: none;
    }

    .node {
      position: absolute;
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      padding: 6px 11px 6px 9px;
      background: rgba(10,16,17,0.92);
      border: 1px solid var(--white-8);
      border-left: 2px solid var(--c, var(--hud));
      color: var(--off-white);
      font-family: 'Inter', sans-serif; text-align: left; white-space: nowrap;
      cursor: pointer;
    }
    .node:hover, .node:focus-visible { border-color: var(--c); background: rgba(16,26,28,0.97); outline: none; }
    /* HUD corner ticks */
    .node::before, .node::after {
      content: ''; position: absolute; width: 5px; height: 5px; pointer-events: none;
      border-color: var(--c); opacity: .8;
    }
    .node::before { top: -1px; right: -1px; border-top: 1px solid; border-right: 1px solid; }
    .node::after  { bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }

    .node-title { font-size: 11.5px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.25; }
    .node-meta {
      font-size: 8.5px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase;
      color: var(--white-32); line-height: 1.3;
    }
    .node-meta b { color: var(--c); font-weight: 600; }

    .node.is-empty { cursor: default; border-style: dashed; }
    .node.is-empty .node-title { color: var(--white-32); font-weight: 400; }
    .node.is-dim { opacity: .1; }
    .node.is-match { border-color: var(--c); background: rgba(20,34,36,0.98); box-shadow: 0 0 0 3px rgba(111,227,225,0.10); }

    /* ── Bottom-left: heading ── */
    .panel-intro {
      position: fixed; left: 32px; bottom: 28px; z-index: 40;
      max-width: 340px; pointer-events: none;
    }
    .panel-eyebrow {
      display: flex; align-items: center; gap: 7px; margin-bottom: 10px;
      font-size: 9px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--hud);
    }
    .panel-eyebrow i { width: 5px; height: 5px; border-radius: 50%; background: var(--hud); }
    .panel-intro h1 {
      font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 600;
      letter-spacing: -0.025em; line-height: 1.12; margin: 0 0 9px;
    }
    .panel-intro p { margin: 0; font-size: 12px; line-height: 1.6; color: var(--white-48); }

    /* ── Bottom-right: index + search ── */
    .panel-index {
      position: fixed; right: 32px; bottom: 28px; z-index: 40; width: 274px;
    }
    .index-search {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
      padding: 8px 11px;
      border: 1px solid var(--white-16); background: rgba(10,16,17,0.8);
    }
    .index-search:focus-within { border-color: var(--hud); }
    .index-search svg { flex: 0 0 auto; color: var(--hud); opacity: .8; }
    .index-search input {
      flex: 1; min-width: 0; border: 0; outline: none; background: none;
      color: var(--off-white); font-family: 'Inter', sans-serif; font-size: 12px;
    }
    .index-search input::placeholder { color: var(--white-32); }
    .index-search kbd {
      font-family: inherit; font-size: 9px; color: var(--white-32);
      border: 1px solid var(--white-16); padding: 1px 5px;
    }

    .index-head {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 9px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--white-32); padding-bottom: 7px; margin-bottom: 5px;
      border-bottom: 1px solid var(--white-8);
    }
    .cat {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 3.5px 0; background: none; border: 0; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 11px; color: var(--white-48);
      text-align: left; transition: color .18s;
    }
    .cat:hover, .cat.is-on { color: var(--off-white); }
    .cat i { width: 6px; height: 6px; flex: 0 0 auto; background: var(--c); }
    .cat span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .cat b {
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em;
      color: var(--white-32); font-variant-numeric: tabular-nums;
    }
    .cat.is-on b { color: var(--hud); }

    /* ── Modal ── */
    .modal {
      position: fixed; inset: 0; z-index: 90; display: none;
      align-items: center; justify-content: center; padding: 24px;
      background: rgba(8,8,8,0.82);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .modal.is-open { display: flex; }
    .modal-card {
      position: relative; width: min(620px, 100%); max-height: 82vh; overflow-y: auto;
      background: #0c1213; border: 1px solid var(--white-16);
      border-top: 2px solid var(--c, var(--hud)); padding: 32px;
    }
    .modal-kicker {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
      font-size: 9px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--white-48);
    }
    .modal-kicker i { width: 6px; height: 6px; background: var(--c); }
    .modal-card h2 { font-family: 'Syne', sans-serif; font-size: 23px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 14px; }
    .modal-card p { margin: 0 0 13px; font-size: 13.5px; line-height: 1.7; color: var(--white-56); }
    .modal-close {
      position: absolute; top: 22px; right: 22px; width: 34px; height: 34px;
      border: 1px solid var(--white-16); background: none; color: var(--off-white);
      cursor: pointer; font-size: 16px; line-height: 1;
    }
    .modal-close:hover { background: rgba(255,255,255,0.08); }

    /* ── Small screens: the map is not usable, so it becomes a list ── */
    @media (max-width: 1200px) {
      /* The panels are siblings of <main>, so the reading order is set on the
         body. nav and .dots are fixed, so they stay out of this flow. */
      body { display: flex; flex-direction: column; }
      .panel-intro { order: 1; }
      main.map     { order: 2; }
      .panel-index { order: 3; }

      .map { height: auto; padding: 24px 20px 40px; overflow: visible; cursor: auto;
             display: flex; flex-direction: column; }
      .links, .gnode { display: none; }
      /* relative, not static: the HUD rings are absolutely positioned and must
         keep anchoring to the core instead of stretching over the whole page. */
      .core { position: relative; left: auto; top: auto; transform: none; margin: 0 auto 28px; order: 1; }
      .nodes { position: static; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 440px; margin: 0 auto; order: 2; }
      .node { position: static !important; left: auto !important; top: auto !important;
              transform: none !important; opacity: 1 !important; white-space: normal; width: 100%; }
      .panel-intro, .panel-index { position: static; width: auto; max-width: 440px; margin: 0 auto; padding: 0 20px; }
      .panel-intro { padding-top: 104px; margin-bottom: 4px; }
      .panel-index { margin: 26px auto 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse, .hud .sweep, .hud .counter { animation: none; }
      .pulse { opacity: .35; }
    }
  </style>
</head>

      { k:'visual',     dt:  0, dp: 20, r:0.90, lv:'m', tg:'p', en:'Variant generation',       pt:'Geração de variações' },

      { k:'responsive', dt:-14, dp:-14, r:0.54, lv:'s', tg:'a', en:'Breakpoints from content', pt:'Breakpoints a partir do conteúdo', body:1 },
      { k:'responsive', dt: 16, dp: 14, r:0.74, lv:'m', tg:'n', en:'Fluid over fixed',         pt:'Fluido em vez de fixo' },

      { k:'mobileweb',  dt:-16, dp: 12, r:0.52, lv:'s', tg:'a', en:'One product, two surfaces',pt:'Um produto, duas superfícies', body:1 },
      { k:'mobileweb',  dt: 16, dp:-16, r:0.72, lv:'m', tg:'c', en:'Touch target audits',      pt:'Auditoria de alvos de toque' },
      { k:'mobileweb',  dt: -2, dp: 20, r:0.90, lv:'j', tg:'n', en:'Native patterns',          pt:'Padrões nativos' },

      { k:'testing',    dt:-14, dp:-12, r:0.52, lv:'m', tg:'a', en:'Timed task comparison',    pt:'Comparação cronometrada', body:1 },
      { k:'testing',    dt: 18, dp: 16, r:0.72, lv:'m', tg:'n', en:'Testing without a lab',    pt:'Testar sem laboratório' },
      { k:'testing',    dt:  0, dp:-22, r:0.90, lv:'j', tg:'p', en:'Session synthesis prompt', pt:'Prompt de síntese de sessão' },

      { k:'systems',    dt:-14, dp: 14, r:0.52, lv:'s', tg:'a', en:'Tokens before components', pt:'Tokens antes de componentes', body:1 },
      { k:'systems',    dt: 16, dp:-14, r:0.74, lv:'s', tg:'c', en:'Keeping Figma and code in sync', pt:'Figma e código em sincronia' }
    ];

    /* Uncategorised points: density, no label, not focusable. Seeded. */
    function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
    var rnd = mulberry32(20260903), GREY = [];
    for (var g = 0; g < 30; g++) GREY.push({ th: rnd()*360, ph: (rnd()-0.5)*150, r: 0.45+rnd()*0.62, sz: rnd()<0.2?4:2.5 });

    var mapEl = document.getElementById('map');
    var nodesEl = document.getElementById('nodes');
    var linksEl = document.getElementById('links');
    var coreEl = document.getElementById('core');
    var els = [], greyEls = [];

    NODES.forEach(function (n, i) {
      var cat = CAT[n.k];
      var b = document.createElement('button');
      b.className = 'node' + (n.body ? '' : ' is-empty');
      b.type = 'button';
      b.style.setProperty('--c', cat.c);
      b.dataset.cat = n.k;
      b.dataset.i = i;
      b.innerHTML =
        '<span class="node-title">' + (PT ? n.pt : n.en) + '</span>' +
        '<span class="node-meta"><b>' + LV[n.lv] + '</b> · ' + TAG[n.tg] + '</span>';
      if (!n.body) { b.setAttribute('aria-disabled', 'true'); b.tabIndex = -1; }
      else b.addEventListener('click', function () { openModal(i); });
      nodesEl.appendChild(b);
      els.push(b);
    });

    GREY.forEach(function (p) {
      var d = document.createElement('i');
      d.className = 'gnode';
      d.style.width = p.sz + 'px'; d.style.height = p.sz + 'px';
      d.setAttribute('aria-hidden', 'true');
      nodesEl.appendChild(d); greyEls.push(d);
    });

    /* ── 3D, static: artifacts hold still. Drag still rotates the shell. ── */
    var DEG = Math.PI / 180, FOV = 1150;
    var rotY = -0.30, rotX = 0.20, dragging = false, lastX = 0, lastY = 0;

    function unit(th, ph) {
      var t = th*DEG, p = ph*DEG;
      return [Math.cos(p)*Math.cos(t), Math.sin(p), Math.cos(p)*Math.sin(t)];
    }
    function project(u, r, R, cx, cy) {
      var X = u[0]*R*r, Y = u[1]*R*r, Z = u[2]*R*r;
      var cB = Math.cos(rotY), sB = Math.sin(rotY);
      var x1 = X*cB - Z*sB, z1 = X*sB + Z*cB;
      var cA = Math.cos(rotX), sA = Math.sin(rotX);
      var y1 = Y*cA - z1*sA, z2 = Y*sA + z1*cA;
      var k = FOV/(FOV+z2);
      return { x: cx + x1*k, y: cy + y1*k, k: k, z: z2 };
    }

    function draw() {
      if (window.innerWidth <= 1200) { linksEl.innerHTML = ''; return; }
      var w = mapEl.clientWidth, h = mapEl.clientHeight;
      var cx = w/2, cy = h*0.46;
      var R = Math.min(w*0.29, h*0.40);
      coreEl.style.top = cy + 'px';

      var pos = NODES.map(function (n) {
        var cat = CAT[n.k];
        return project(unit(cat.th + n.dt, cat.ph + n.dp), n.r, R, cx, cy);
      });

      /* Keep cards out of the core and out of the two corner panels, and stop
         labels stacking. Same array the links read, so lines stay attached. */
      var box = els.map(function (el) { return [el.offsetWidth, el.offsetHeight]; });
      var coreR = 152;   /* ring is r=130 inside a 268px box, plus breathing room */
      var zones = [];
      [document.querySelector('.panel-intro'), document.querySelector('.panel-index')].forEach(function (p) {
        var r = p.getBoundingClientRect();
        zones.push({ l: r.left - 16, t: r.top - 16, rt: r.right + 16, b: r.bottom + 16 });
      });

      /* Two stages per pass, in this order: cards push each other apart first,
         then the hard constraints (core, panels, viewport) are re-applied, so a
         neighbour can never shove a card back into a panel or the HUD. */
      function hard(i) {
        var bw = box[i][0]/2, bh = box[i][1]/2;

        /* Rect vs. the HUD ring: measure from the card edge nearest the core,
           not from its centre, or a wide card clips the ring with one corner. */
        var dx = pos[i].x - cx, dy = pos[i].y - cy;
        var d = Math.hypot(dx, dy) || 1;
        var ex = Math.max(Math.abs(dx) - bw, 0), ey = Math.max(Math.abs(dy) - bh, 0);
        var edge = Math.hypot(ex, ey);
        if (edge < coreR) { var p = coreR - edge + 2; pos[i].x += dx/d*p; pos[i].y += dy/d*p; }

        zones.forEach(function (z) {
          if (pos[i].x + bw > z.l && pos[i].x - bw < z.rt && pos[i].y + bh > z.t && pos[i].y - bh < z.b) {
            /* Take the shortest escape that still lands inside the viewport.
               A sideways push out of a corner panel gets undone by the clamp
               below, which is how cards ended up sitting on the panels. */
            var cands = [
              { x: pos[i].x,             y: z.t - bh - 2,  cost: Math.abs(pos[i].y - (z.t - bh - 2)) },
              { x: z.l - bw - 2,         y: pos[i].y,      cost: Math.abs(pos[i].x - (z.l - bw - 2)) },
              { x: z.rt + bw + 2,        y: pos[i].y,      cost: Math.abs(pos[i].x - (z.rt + bw + 2)) }
            ].filter(function (c) {
              return c.x >= bw + 12 && c.x <= w - bw - 12 && c.y >= bh + 88 && c.y <= h - bh - 14;
            }).sort(function (a, b) { return a.cost - b.cost; });
            var pick = cands[0] || { x: pos[i].x, y: z.t - bh - 2 };
            pos[i].x = pick.x; pos[i].y = pick.y;
          }
        });

        pos[i].x = Math.max(bw+12, Math.min(w-bw-12, pos[i].x));
        pos[i].y = Math.max(bh+88, Math.min(h-bh-14, pos[i].y));
      }

      /* Short or narrow viewports have less room than the card set needs at a
         comfortable gap, and the solver then oscillates instead of settling.
         Ask for less breathing room there so it can actually converge. */
      var roomy = w * h > 1.15e6;
      var gapX = roomy ? 10 : 5, gapY = roomy ? 8 : 4;

      for (var pass = 0; pass < 90; pass++) {
        var moved = false;
        for (var i = 0; i < pos.length; i++) {
          for (var j = i+1; j < pos.length; j++) {
            var ddx = pos[j].x - pos[i].x, ddy = pos[j].y - pos[i].y;
            var mx = box[i][0]/2 + box[j][0]/2 + gapX, my = box[i][1]/2 + box[j][1]/2 + gapY;
            if (Math.abs(ddx) >= mx || Math.abs(ddy) >= my) continue;
            var ox = mx - Math.abs(ddx), oy = my - Math.abs(ddy);
            if (ox < oy) { var s1 = (ddx<0?-1:1)*ox/2; pos[i].x -= s1; pos[j].x += s1; }
            else         { var s2 = (ddy<0?-1:1)*oy/2; pos[i].y -= s2; pos[j].y += s2; }
            moved = true;
          }
        }
        for (var k = 0; k < pos.length; k++) hard(k);
        if (!moved) break;
      }

      NODES.forEach(function (n, i) {
        var p = pos[i], el = els[i];
        var depth = (p.z + R) / (2*R);
        el.style.left = (p.x - box[i][0]/2) + 'px';
        el.style.top  = (p.y - box[i][1]/2) + 'px';
        el.style.opacity = (0.44 + depth*0.56).toFixed(3);
        el.style.zIndex = Math.round(500 - p.z);
      });

      GREY.forEach(function (p, i) {
        var pr = project(unit(p.th, p.ph), p.r, R, cx, cy);
        var depth = (pr.z + R) / (2*R);
        var el = greyEls[i];
        el.style.left = pr.x + 'px'; el.style.top = pr.y + 'px';
        el.style.transform = 'translate(-50%, -50%)';
        el.style.opacity = (0.08 + depth*0.4).toFixed(3);
      });

      /* Every line leaves the core; the pulse rides the same path outward. */
      var svg = '';
      pos.forEach(function (p, i) {
        var dx = p.x - cx, dy = p.y - cy;
        var len = Math.hypot(dx, dy) || 1;
        var bend = Math.min(len*0.13, 46);
        var qx = (cx + p.x)/2 + (-dy/len)*bend, qy = (cy + p.y)/2 + (dx/len)*bend;
        var d = 'M' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' Q' + qx.toFixed(1) + ' ' + qy.toFixed(1) +
                ' ' + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
        svg += '<path class="link" data-i="' + i + '" d="' + d + '"/>';
        svg += '<path class="pulse" data-i="' + i + '" d="' + d + '" style="animation-delay:' +
               (-(i * 0.31) % 3.2).toFixed(2) + 's;stroke:' + CAT[NODES[i].k].c + '"/>';
      });
      linksEl.innerHTML = svg;
    }

    draw();
    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(draw, 120); });

    mapEl.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.node')) return;
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      mapEl.setPointerCapture(e.pointerId);
    });
    mapEl.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      rotY += (e.clientX - lastX) * 0.005;
      rotX = Math.max(-0.85, Math.min(0.85, rotX + (e.clientY - lastY) * 0.004));
      lastX = e.clientX; lastY = e.clientY;
      draw();
    });
    ['pointerup','pointercancel'].forEach(function (ev) {
      mapEl.addEventListener(ev, function () { dragging = false; });
    });

    /* ── Category index, with counts ── */
    var catList = document.getElementById('catList');
    var counts = {};
    NODES.forEach(function (n) { counts[n.k] = (counts[n.k] || 0) + 1; });
    document.getElementById('indexCount').textContent = NODES.length;
    document.getElementById('coreReadout').textContent =
      NODES.length + T(' artifacts · ', ' artefatos · ') + CATS.length + T(' categories', ' categorias');

    var active = null;
    CATS.forEach(function (k) {
      var b = document.createElement('button');
      b.className = 'cat'; b.type = 'button';
      b.style.setProperty('--c', k.c);
      b.innerHTML = '<i></i><span>' + (PT ? k.pt : k.en) + '</span><b>' +
                    String(counts[k.id] || 0).padStart(2, '0') + '</b>';
      b.addEventListener('click', function () {
        active = (active === k.id) ? null : k.id;
        catList.querySelectorAll('.cat').forEach(function (o) { o.classList.remove('is-on'); });
        if (active) b.classList.add('is-on');
        apply();
      });
      catList.appendChild(b);
    });

    /* ── Search ── */
    var input = document.getElementById('searchInput');
    function apply() {
      var term = input.value.trim().toLowerCase();
      var hits = 0;
      els.forEach(function (el, i) {
        var n = NODES[i], cat = CAT[n.k];
        var hay = ((PT ? n.pt : n.en) + ' ' + (PT ? cat.pt : cat.en) + ' ' + LV[n.lv] + ' ' + TAG[n.tg]).toLowerCase();
        var okTerm = !term || hay.indexOf(term) !== -1;
        var okCat = !active || n.k === active;
        var on = okTerm && okCat;
        el.classList.toggle('is-dim', !on);
        el.classList.toggle('is-match', on && (!!term || !!active));
        if (on) hits++;
      });
      linksEl.querySelectorAll('.pulse, .link').forEach(function (p) {
        var n = NODES[+p.dataset.i], cat = CAT[n.k];
        var hay = ((PT ? n.pt : n.en) + ' ' + (PT ? cat.pt : cat.en)).toLowerCase();
        var on = (!term || hay.indexOf(term) !== -1) && (!active || n.k === active);
        p.style.display = on ? '' : 'none';
      });
      document.getElementById('indexCount').textContent = hits;
    }
    input.addEventListener('input', apply);
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement !== input && !modal.classList.contains('is-open')) {
        e.preventDefault(); input.focus();
      }
      if (e.key === 'Escape') {
        if (modal.classList.contains('is-open')) closeModal();
        else if (input.value || active) { input.value = ''; active = null;
          catList.querySelectorAll('.cat').forEach(function (o) { o.classList.remove('is-on'); }); apply(); }
      }
    });

    /* ── Modal ── */
    var modal = document.getElementById('modal');
    var card = document.getElementById('modalCard');
    var lastFocus = null;
    function openModal(i) {
      var n = NODES[i], cat = CAT[n.k];
      lastFocus = document.activeElement;
      card.style.setProperty('--c', cat.c);
      document.getElementById('modalKicker').textContent =
        (PT ? cat.pt : cat.en) + ' · ' + LV[n.lv] + ' · ' + TAG[n.tg];
      document.getElementById('modalTitle').textContent = PT ? n.pt : n.en;
      document.getElementById('modalBody').innerHTML =
        '<p>' + T('This note is still a placeholder. It will hold how this step actually runs — what I ask the model, what I keep for myself, and where the two disagree.',
                  'Esta nota ainda é um placeholder. Vai descrever como essa etapa funciona na prática — o que eu peço ao modelo, o que eu mantenho comigo, e onde os dois discordam.') + '</p>';
      modal.classList.add('is-open');
      document.getElementById('modalClose').focus();
    }
    function closeModal() { modal.classList.remove('is-open'); if (lastFocus) lastFocus.focus(); }
    document.getElementById('modalClose').addEventListener('click', closeModal);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  })();
  </script>

  <script>
    (function () {
      var canvas = document.getElementById('glassLogoCanvas');
      var ok = false;
      try { var c = document.createElement('canvas'); ok = !!(c.getContext('webgl2') || c.getContext('webgl')); }
      catch (e) { ok = false; }
      if (!ok || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('no-webgl'); return;
      }
      var s = document.createElement('script');
      s.src = '../assets/vendor/glass-logo.js';
      s.onload = function () {
        if (window.__mountGlassLogo) window.__mountGlassLogo(canvas);
        else document.documentElement.classList.add('no-webgl');
      };
      s.onerror = function () { document.documentElement.classList.add('no-webgl'); };
      document.body.appendChild(s);
    })();
  </script>

</body>
