<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand board · Micro-interactions · Guilherme Kerber</title>
  <meta name="description" content="The Gui Kerber brand on one board: the 3D icon that breaks apart and comes back, the type, the wordmark and one orange accent, with the site's laser lines running behind.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500&family=Martian+Mono:wght@400&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../shared/stage.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="stage">
    <canvas class="strings" aria-hidden="true"></canvas>

    <section class="board" aria-labelledby="board-title">
      <h1 class="sr-only" id="board-title">Gui Kerber brand board</h1>

      <div class="cell cell--icon">
        <p class="cell__label"><span class="cell__index">01</span>Icon</p>
        <canvas class="icon__canvas" aria-hidden="true"></canvas>
        <button class="cell__hit icon__hit" type="button" aria-label="Break the 3D icon apart and put it back together"></button>
        <p class="cell__note">3D · Metal and rim light</p>
      </div>

      <div class="cell cell--type">
        <p class="cell__label"><span class="cell__index">02</span>Type</p>
        <p class="sample">
          <span class="sample__line">Crafting products</span>
          <span class="sample__line">that <span class="rotator" aria-hidden="true"><span class="rotator__word is-active">launch.</span><span class="rotator__word">scale.</span><span class="rotator__word">convert.</span><span class="rotator__word">last.</span></span><span class="sr-only rotator__spoken">launch.</span></span>
        </p>
        <button class="cell__hit type__hit" type="button" aria-label="Show the next word in the headline"></button>
        <ul class="families" role="list">
          <li class="family family--display">Familjen Grotesk<span class="family__role">Display</span></li>
          <li class="family family--body">Inter Tight<span class="family__role">Body</span></li>
          <li class="family family--mono">Martian Mono<span class="family__role">Mono</span></li>
        </ul>
      </div>

      <div class="cell cell--mark">
        <p class="cell__label"><span class="cell__index">03</span>Wordmark</p>
        <p class="lockup">
          <svg class="lockup__mark" viewBox="0 0 27 26.7773" aria-hidden="true"><path id="logo-path" fill="currentColor" fill-rule="evenodd" d="M23.6533 0C25.5015 0.000230991 26.9998 1.49846 27 3.34668V23.4297C27 25.2781 25.5017 26.7771 23.6533 26.7773H3.34668C1.49832 26.7771 0 25.2781 0 23.4297V3.34668C0.00023112 1.49846 1.49846 0.000231099 3.34668 0H23.6533ZM12.3516 4.68652C12.3514 4.34856 11.9897 4.13304 11.6924 4.29395L6.48145 7.11523C6.3376 7.19328 6.24805 7.34413 6.24805 7.50781V21.9736C6.24805 22.3153 6.61656 22.5303 6.91406 22.3623L20.749 14.5479C20.8888 14.4687 20.9754 14.3208 20.9756 14.1602V9.83398C20.9754 9.49138 20.605 9.27706 20.3076 9.44727L17.2646 11.1885C16.9671 11.3587 16.5967 11.1436 16.5967 10.8008V7.11523C16.5967 6.76916 16.2194 6.55461 15.9219 6.73145L13.0254 8.45312C12.728 8.62957 12.3516 8.41526 12.3516 8.06934V4.68652ZM18.7441 17.8916C17.5118 17.8916 16.5127 18.8907 16.5127 20.123C16.5128 21.3553 17.5118 22.3545 18.7441 22.3545C19.9762 22.3542 20.9745 21.3552 20.9746 20.123C20.9746 18.8908 19.9763 17.8918 18.7441 17.8916Z"/></svg>
          <span class="lockup__word">GUI KERBER<sup>®</sup></span>
        </p>
        <p class="cell__note">Mark and wordmark</p>
      </div>

      <div class="cell cell--color">
        <p class="cell__label"><span class="cell__index">04</span>Color</p>
        <div class="swatches">
          <button class="swatch swatch--ink" type="button" data-hex="#040508">
            <span class="swatch__name">Ink</span>
            <span class="swatch__code"><span class="swatch__hex">#040508</span><span class="swatch__done" aria-hidden="true">Copied</span><span class="swatch__fail" aria-hidden="true">Couldn't copy</span></span>
          </button>
          <button class="swatch swatch--paper" type="button" data-hex="#E8E8E8">
            <span class="swatch__name">Paper</span>
            <span class="swatch__code"><span class="swatch__hex">#E8E8E8</span><span class="swatch__done" aria-hidden="true">Copied</span><span class="swatch__fail" aria-hidden="true">Couldn't copy</span></span>
          </button>
          <button class="swatch swatch--accent" type="button" data-hex="#FF5A1F">
            <span class="swatch__name">Accent</span>
            <span class="swatch__code"><span class="swatch__hex">#FF5A1F</span><span class="swatch__done" aria-hidden="true">Copied</span><span class="swatch__fail" aria-hidden="true">Couldn't copy</span></span>
          </button>
        </div>
        <p class="sr-only" aria-live="polite" data-copy-status></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="../shared/loop.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
