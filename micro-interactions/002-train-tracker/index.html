<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train tracker · Micro-interactions · Guilherme Kerber</title>
  <meta name="description" content="A button opens into a trip card whose top is a landscape, where a soft 3D bullet train rolls along while the world slides past it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../shared/stage.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="stage">
    <div class="tracker-shadow">
      <section class="tracker" aria-labelledby="tracker-title">
        <h1 class="tracker__title" id="tracker-title">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="4"/><path d="M5 10h14M9 21l2-4M15 21l-2-4"/><circle cx="9" cy="13.5" r=".6"/><circle cx="15" cy="13.5" r=".6"/></svg>
          Track my train
        </h1>
        <button class="tracker__toggle" type="button" aria-expanded="false" aria-controls="tracker-body" aria-labelledby="tracker-title"></button>
        <button class="tracker__close" type="button" aria-label="Close trip">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </button>

        <div class="tracker__body" id="tracker-body">
          <!-- The top of the card is the landscape itself -->
          <div class="slot" data-slot="hero">
            <span class="skeleton sk sk--hero"></span>
            <div class="slot__content hero" role="img" aria-label="Your train on the move between Lisbon and Porto">
              <canvas class="hero__canvas"></canvas>
              <p class="hero__offline">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a14 14 0 0 1 4-2.4M10.5 5.1A14 14 0 0 1 21 9M6.5 12.5a8.5 8.5 0 0 1 3-1.8M14 10.7a8.5 8.5 0 0 1 3.5 1.8M10 16.2a3.5 3.5 0 0 1 4 0M12 19.5h.01M4 4l16 16"/></svg>
                You're offline. Your train shows up again once you're back.
              </p>
            </div>
          </div>

          <div class="tracker__info">
            <div class="slot" data-slot="meta">
              <span class="skeleton sk sk--line"></span>
              <p class="slot__content meta"><span>Train 521</span><span>Coach 4, Seat 42</span></p>
            </div>

            <div class="slot" data-slot="route">
              <span class="skeleton sk sk--block"></span>
              <div class="slot__content route">
                <div class="route__stop">
                  <p class="route__code">LIS</p>
                  <p class="route__time">Lisbon · 08:30</p>
                </div>
                <div class="route__track" aria-hidden="true">
                  <!-- A stretch of track seen from above: the part behind you is inked in -->
                  <div class="rail">
                    <span class="rail__ties"></span>
                    <span class="rail__ties rail__ties--done"></span>
                    <span class="rail__marker">
                      <svg class="rail__train" viewBox="0 0 40 12"><path class="rail__body" d="M4 2h21c6 0 11 2.5 13 4-2 1.5-7 4-13 4H4a4 4 0 0 1 0-8z"/><path class="rail__glass" d="M25.5 3.2c4.6.3 8.6 1.6 10.6 2.8-2 1.2-6 2.5-10.6 2.8a14 14 0 0 0 0-5.6z"/></svg>
                    </span>
                  </div>
                  <p class="route__label">Direct</p>
                </div>
                <div class="route__stop route__stop--end">
                  <p class="route__code">OPO</p>
                  <p class="route__time">Porto · 11:15</p>
                </div>
              </div>
            </div>

            <div class="slot" data-slot="status">
              <span class="skeleton sk sk--block"></span>
              <div class="slot__content status">
                <div>
                  <p class="status__state"><span class="status__dot" aria-hidden="true"></span>On time</p>
                  <p class="status__eta">Arriving in <span class="eta"><span class="eta__now">48</span><span class="eta__next" aria-hidden="true">47</span></span> min</p>
                </div>
                <p class="status__trip">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
                  2h 45m
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="../shared/loop.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
